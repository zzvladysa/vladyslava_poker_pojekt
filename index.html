<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/lobby.css">
    <link rel="stylesheet" href="style/poker.css">
    <link rel="stylesheet" href="style/blackjack.css">
    <title>Texas Hold'em</title>
    <base target="_blank">
</head>

<body>
    <!-- Фоновое фото (размыто/затемнено через CSS) -->
    <div class="bg" aria-hidden="true"></div>
    <main>
        <!-- ВЫБОР РЕЖИМА -->
        <section id="mode-screen">
            <h1>♠ Casino</h1>
            <div class="modes">
                <button class="mode active" data-mode="poker">
                    <span class="mode-icon">♠</span>
                    <b>Poker</b>
                    <small>Texas Hold'em</small>
                </button>
                <button class="mode" data-mode="blackjack">
                    <span class="mode-icon red">♥</span>
                    <b>Blackjack</b>
                    <small>21</small>
                </button>
            </div>
            <button id="mode-start" class="gold-btn">Start</button>
        </section>

        <!-- ЭКРАН НАСТРОЕК -->
        <section id="setup-screen" class="hidden">
            <button id="back-btn" class="back-btn" type="button" data-i18n="mainMenu">← Hauptmenü</button>
            <h1>♠ Texas Hold'em</h1>

            <div class="field">
                <label for="set-lang" data-i18n="setLang">Sprache:</label>
                <select id="set-lang">
                    <option value="de" selected>Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="field">
                <label for="set-players" data-i18n="setPlayers">Anzahl der Spieler:</label>
                <select id="set-players">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>

            <div class="field">
                <label for="set-stack" data-i18n="setStack">Startstack ($):</label>
                <input id="set-stack" type="number" value="1000" min="100" step="50">
            </div>

            <div class="field">
                <label for="set-bb" data-i18n="setBB">Big Blind BB ($):</label>
                <input id="set-bb" type="number" value="20" min="2" step="2">
            </div>

            <button id="start-btn" class="gold-btn" data-i18n="start">Spiel starten</button>
        </section>

        <!-- ИГРОВОЙ ЭКРАН -->
        <section id="game-screen" class="hidden">
            <div id="topbar">
                <button id="menu-btn" data-i18n="menu">Menü</button>
                <select id="game-lang">
                    <option value="de" selected>Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div id="poker-table">
                <div id="center">
                    <div id="street">Preflop</div>
                    <div id="pot">Pot: $0</div>
                    <div id="board"></div>
                    <button id="next-btn" class="gold-btn hidden" data-i18n="continueBtn">Weiter</button>
                </div>
                <div id="players-container"></div>
            </div>

            <div id="controls">
                <button id="fold-btn" class="btn-red" data-i18n="fold">Passen</button>
                <button id="call-btn" class="btn-green">Check</button>

                <div id="raise-box">
                    <button id="raise-btn" class="btn-gold">Setzen</button>
                    <input type="range" id="bet-slider">
                    <input type="number" id="bet-input">
                </div>

                <button id="allin-btn" class="btn-purple" data-i18n="allIn">All-In</button>
            </div>

            <div id="log"></div>

            <button id="rank-btn" data-i18n="rankBtn">Kombinationen</button>
            <div id="rank-modal" class="hidden">
                <div class="modal-box">
                    <button id="rank-close">✕</button>
                    <img src="img/hand-rankings.png" alt="Poker Hand Rankings">
                </div>
            </div>

            <!-- Окно подтверждения (вместо стандартного confirm браузера) -->
            <div id="confirm-modal" class="hidden">
                <div class="dialog">
                    <p id="confirm-text"></p>
                    <div class="dialog-buttons">
                        <button id="confirm-yes" class="gold-btn" data-i18n="yes">Ja</button>
                        <button id="confirm-no" data-i18n="cancel">Abbrechen</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- БЛЭКДЖЕК -->
        <section id="bj-screen" class="hidden">
            <div id="bj-topbar">
                <button id="bj-menu" type="button">← Hauptmenü</button>
                <div id="bj-balance"></div>
                <select id="bj-lang">
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div id="bj-table">
                <div class="bj-area">
                    <div class="bj-label" id="bj-dealer-label"></div>
                    <div class="bj-hand" id="bj-dealer"></div>
                    <div class="bj-total" id="bj-dealer-total"></div>
                </div>

                <div id="bj-center">
                    <div id="bj-msg"></div>
                    <div id="bj-bet"></div>
                </div>

                <div class="bj-area">
                    <div class="bj-total" id="bj-player-total"></div>
                    <div class="bj-hand" id="bj-player"></div>
                    <div class="bj-label" id="bj-player-label"></div>
                </div>
            </div>

            <div id="bj-controls">
                <div id="bj-bet-ui">
                    <div id="bj-chips"></div>
                    <button id="bj-clear" type="button"></button>
                    <button id="bj-deal" type="button" class="gold-btn"></button>
                </div>
                <div id="bj-play-ui" class="hidden">
                    <button id="bj-hit" type="button" class="btn-green"></button>
                    <button id="bj-stand" type="button" class="btn-red"></button>
                    <button id="bj-double" type="button" class="btn-purple"></button>
                </div>
                <button id="bj-next" type="button" class="gold-btn hidden"></button>
            </div>
        </section>
    </main>

    <!-- Порядок важен: script.js использует функции из lang.js и deck.js -->
    <script src="js/lang.js"></script>
    <script src="js/deck.js"></script>
    <script src="js/player.js"></script>
    <script src="js/hands.js"></script>
    <script src="js/render.js"></script>
    <script src="js/bots.js"></script>
    <script src="js/state.js"></script>
    <script src="js/game.js"></script>
    <script src="js/script.js"></script>
    <script src="js/blackjack.js"></script>
    <script src="js/mode.js"></script>
</body>

</html>
